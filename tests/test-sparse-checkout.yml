name: Test sparse checkout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: actions/checkout
          ref: main
          path: checkout-sparse
          sparse-checkout: |
            action.yml
            package.json
          persist-credentials: false

      - name: Assert checkout result
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit: $COMMIT"
          if [ "$OUTCOME" = "success" ]; then
            # Verify checkout directory exists
            if [ ! -d "$GITHUB_WORKSPACE/checkout-sparse" ]; then
              echo "FAIL: checkout-sparse directory not found"
              exit 1
            fi
            echo "PASS: checkout-sparse directory exists"
            # Verify sparse-checked-out files exist
            if [ ! -f "$GITHUB_WORKSPACE/checkout-sparse/action.yml" ]; then
              echo "FAIL: action.yml not found in sparse checkout"
              exit 1
            fi
            echo "PASS: action.yml found in sparse checkout"
            # Verify commit output looks like a SHA
            if [ -z "$COMMIT" ]; then
              echo "FAIL: commit output is empty"
              exit 1
            fi
            if ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
              echo "FAIL: commit output does not look like a SHA: $COMMIT"
              exit 1
            fi
            echo "PASS: commit output is a valid SHA"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo context is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
